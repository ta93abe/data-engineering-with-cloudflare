[package]
name = "parquet-encoder"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = { version = "58", default-features = false, features = ["json"] }
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
