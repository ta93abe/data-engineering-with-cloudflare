name: dbt Merge

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "transform/core/**"
      - ".github/workflows/dbt-merge.yml"

permissions:
  actions: read
  contents: read
  id-token: write

env:
  SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
  SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
  SNOWFLAKE_USER: DBT_SERVICE_USER
  SNOWFLAKE_ROLE: DBT_ROLE
  SNOWFLAKE_WAREHOUSE: ANALYTICS_WH
  SNOWFLAKE_DATABASE: CORE
  SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
  SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

jobs:
  merge:
    name: Merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: dbt
    steps:
      - uses: actions/checkout@v6

      - name: Get Snowflake OIDC token
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=snowflakecomputing.com" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to retrieve Snowflake OIDC token"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          echo "SNOWFLAKE_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: dbt merge
        uses: ta93abe/dbt-jobs@v0.1.3
        with:
          type: merge
          adapter: snowflake
          project-dir: transform/core
          profile-dir: transform/core
          target: snowflake
          command: |
            dbt build --select state:modified+
          deferral: main
