name: dbt Deploy

on:
  workflow_dispatch:

concurrency:
  group: dbt-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
  SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dbt
    steps:
      - uses: actions/checkout@v6

      - name: dbt deploy
        uses: ta93abe/dbt-jobs@v0.2.0
        with:
          type: deploy
          adapter: snowflake
          project-dir: transform/core
          profile-dir: transform/core
          target: snowflake
          command: |
            dbt build
          deferral: main
