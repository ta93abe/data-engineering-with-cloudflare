name: Biome Check

on:
  pull_request:
    paths:
      - "ingestion/**"
      - ".github/workflows/biome-check.yml"
  push:
    branches:
      - main
    paths:
      - "ingestion/**"
      - ".github/workflows/biome-check.yml"

jobs:
  biome:
    name: Run Biome
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "ingestion/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm run check
