name: D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/d1/migrations/**"
      - ".github/workflows/d1-migrations.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/d1

    steps:
      - uses: actions/checkout@v6

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infrastructure/d1
          wranglerVersion: "4.61.0"
          command: d1 migrations apply raw --remote
