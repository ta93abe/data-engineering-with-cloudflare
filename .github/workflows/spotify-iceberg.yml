name: spotify-iceberg CI

on:
  pull_request:
    paths:
      - "spotify-iceberg/**"
      - ".github/workflows/spotify-iceberg.yml"
  push:
    branches: [main]
    paths:
      - "spotify-iceberg/**"
      - ".github/workflows/spotify-iceberg.yml"

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-iceberg/worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: spotify-iceberg/worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:run

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-iceberg/container
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -v
