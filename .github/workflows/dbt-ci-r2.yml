name: dbt CI (R2)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "transform/core/**"
      - ".github/workflows/dbt-ci-r2.yml"

permissions:
  contents: read

jobs:
  build:
    name: dbt build → R2
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dbt-runner container
        env:
          DBT_RUNNER_URL: https://dbt-runner.ta93abe.workers.dev
          DBT_RUN_SECRET: ${{ secrets.DBT_RUN_SECRET }}
          GIT_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${DBT_RUN_SECRET}" \
            "${DBT_RUNNER_URL}/run?ref=${GIT_REF}&env=ci-${PR_NUMBER}" \
            --max-time 30
