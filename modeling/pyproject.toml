[project]
name = "modeling"
version = "0.1.0"
description = "dbt (Snowflake) modeling project for Cloudflare Data Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-core>=1.11.0,<1.12.0",
    "dbt-snowflake>=1.11.0,<1.12.0",
]

[dependency-groups]
dev = [
    "dbtective>=0.3.2",
    "shandy-sqlfmt[jinjafmt]>=0.24.0",
    "sqruff>=0.24.0",
]
