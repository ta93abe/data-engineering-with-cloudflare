version: 2

sources:
  - name: r2_seeds
    description: >
      Healthcare seed tables stored as Iceberg tables in the R2 Data Catalog
      and exposed to Snowflake via the `r2_lakehouse` catalog-linked database.
      Populated by `scripts/load_seeds_to_r2.py`.
    database: r2_lakehouse
    schema: seeds
    tables:
      - name: raw_patients
        description: >
          Patient master data. The source legitimately carries
          multiple rows per patient_id (change history), so only
          not_null is enforced here -- the Data Vault satellite
          handles uniqueness via (hk_patient_h, ldts).
        columns:
          - name: patient_id
            description: Business key (may repeat across load batches)
            tests:
              - not_null
      - name: raw_doctors
        description: Doctor master data
        columns:
          - name: doctor_id
            tests:
              - unique
              - not_null
      - name: raw_departments
        description: Hospital department master
        columns:
          - name: department_id
            tests:
              - unique
              - not_null
      - name: raw_medications
        description: Medication master
        columns:
          - name: medication_id
            tests:
              - unique
              - not_null
      - name: raw_visits
        description: Hospital visit events (patient x doctor x department)
        columns:
          - name: visit_id
            tests:
              - unique
              - not_null
      - name: raw_prescriptions
        description: Medication prescribed during a visit
        columns:
          - name: prescription_id
            tests:
              - unique
              - not_null
      - name: raw_patient_insurance
        description: Patient <-> insurance company coverage with validity dates
        columns:
          - name: patient_id
            tests:
              - not_null
          - name: insurance_id
            tests:
              - not_null
          - name: policy_number
            tests:
              - unique
              - not_null
      - name: raw_insurance_companies
        description: Insurance company master
        columns:
          - name: insurance_id
            tests:
              - unique
              - not_null
