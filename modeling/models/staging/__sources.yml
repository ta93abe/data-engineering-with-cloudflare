version: 2

sources:
  - name: ecom
    description: >
      Jaffle Shop raw tables stored as Iceberg tables in the R2 Data
      Catalog and exposed to Snowflake via the `r2_lakehouse` catalog-
      linked database. Populated by `scripts/load_seeds_to_r2.py`.
    database: r2_lakehouse
    schema: seeds
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
        columns:
          - name: id
            description: Customer id (business key)
            data_tests:
              - unique
              - not_null
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        config:
          loaded_at_field: ordered_at
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: raw_items
        description: Items included in an order
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: raw_stores
        description: Physical jaffle shop locations
        config:
          loaded_at_field: opened_at
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: raw_products
        description: One record per SKU for items sold in stores
        columns:
          - name: sku
            data_tests:
              - unique
              - not_null
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores
