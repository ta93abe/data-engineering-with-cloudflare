models:
  - name: compare_fan_trap
    description: >
      Compares per-hotel booking totals + average rate using three methods:
      (1) ground_truth - independent aggregation then join (correct),
      (2) traditional - naive JOIN causing fan-out from rate_history 1:N (wrong),
      (3) bridge - Puppini Bridge approach (correct).
      Rows with has_fan_trap=true show where traditional JOIN inflates booking amounts.
    columns:
      - name: hotel_id
        description: Primary key for each hotel.
        data_tests:
          - not_null
          - unique
