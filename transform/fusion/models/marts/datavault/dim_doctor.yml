version: 2

models:
  - name: dim_doctor
    description: >
      医師ディメンション。Hub + 最新の Satellite を結合したフラットなテーブル。
    columns:
      - name: DOCTOR_HK
        description: 医師ハッシュキー
        data_tests: [unique, not_null]
      - name: DOCTOR_ID
        description: 医師ビジネスキー（DOC-001 形式）
        data_tests: [unique, not_null]
      - name: FIRST_NAME
        description: 名
      - name: LAST_NAME
        description: 姓
      - name: FULL_NAME
        description: 氏名（FIRST_NAME + LAST_NAME）
      - name: SPECIALTY
        description: 専門科
      - name: LICENSE_NUMBER
        description: 医師免許番号
      - name: HUB_LOAD_DATETIME
        description: Hub レコードの初回ロード日時
      - name: SAT_LOAD_DATETIME
        description: 最新 Satellite レコードのロード日時
