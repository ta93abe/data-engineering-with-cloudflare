version: 2

models:
  - name: fct_visits
    description: >
      診察ファクトテーブル。Link（関係）+ Satellite（属性）を結合し、
      ディメンションキーとメジャー（計測値）を持つ。粒度は 1診察 = 1行。
    columns:
      - name: LINK_VISIT_HK
        description: 診察Link ハッシュキー
        data_tests: [unique, not_null]
      - name: VISIT_ID
        description: 診察ビジネスキー
      - name: PATIENT_HK
        description: 患者ハッシュキー（FK → dim_patient）
        data_tests: [not_null]
      - name: DOCTOR_HK
        description: 医師ハッシュキー（FK → dim_doctor）
        data_tests: [not_null]
      - name: VISIT_DATE
        description: 診察日（FK → dim_date）
      - name: DIAGNOSIS_CODE
        description: 診断コード
      - name: DIAGNOSIS_NAME
        description: 診断名
      - name: NOTES
        description: 診察備考
      - name: TREATMENT_COST
        description: 治療費
