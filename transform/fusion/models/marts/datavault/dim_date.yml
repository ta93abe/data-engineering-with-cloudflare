version: 2

models:
  - name: dim_date
    description: >
      日付ディメンション。診察データの日付範囲をカバーする日付テーブル。
      Databricks の SEQUENCE + EXPLODE で動的に生成する。
    columns:
      - name: DATE_KEY
        description: 日付キー（DATE 型）
        data_tests: [unique, not_null]
      - name: YEAR
        description: 年
      - name: MONTH
        description: 月
      - name: DAY_OF_MONTH
        description: 日
      - name: DAY_OF_WEEK
        description: 曜日番号（1=日〜7=土）
      - name: DAY_NAME_JP
        description: 曜日名（日本語：月〜日）
      - name: WEEK_OF_YEAR
        description: 年内の週番号
      - name: QUARTER
        description: 四半期（1〜4）
      - name: IS_WEEKDAY
        description: 平日フラグ（TRUE/FALSE）
      - name: YEAR_MONTH
        description: 年月（yyyy-MM 形式）
