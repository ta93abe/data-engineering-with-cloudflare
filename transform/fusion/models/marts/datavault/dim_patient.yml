version: 2

models:
  - name: dim_patient
    description: >
      患者ディメンション。Hub（ビジネスキー）+ 最新の Satellite（属性）+
      Computed Satellite（診察統計）を結合し、分析用のフラットなテーブルを作成する。
      SCD Type 1（最新値のみ）で実装。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー
        data_tests: [unique, not_null]
      - name: PATIENT_ID
        description: 患者ビジネスキー（PAT-001 形式）
        data_tests: [unique, not_null]
      - name: FIRST_NAME
        description: 名
      - name: LAST_NAME
        description: 姓
      - name: FULL_NAME
        description: 氏名（FIRST_NAME + LAST_NAME）
      - name: DATE_OF_BIRTH
        description: 生年月日
      - name: GENDER
        description: 性別（M/F）
      - name: ADDRESS
        description: 住所（最新）
      - name: PHONE
        description: 電話番号（最新）
      - name: TOTAL_VISITS
        description: 総診察回数
      - name: DISTINCT_DOCTORS
        description: 担当医師数
      - name: TOTAL_TREATMENT_COST
        description: 治療費合計
      - name: FIRST_VISIT_DATE
        description: 初回診察日
      - name: LAST_VISIT_DATE
        description: 最終診察日
      - name: DISTINCT_MEDICATIONS
        description: 処方された薬の種類数
