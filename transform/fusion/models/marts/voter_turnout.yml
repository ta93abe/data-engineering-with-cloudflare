models:
  - name: voter_turnout
    description: >
      投票率分析マート。選挙ごとの都道府県別投票率を全国平均・地方平均と比較。
      1行1選挙×1都道府県。turnout_rankで投票率順のランキングを提供。
    columns:
      - name: election_id
        description: 選挙ID。
      - name: election_name
        description: 選挙の正式名称。
      - name: chamber
        description: 院の識別子（lower/upper）。
      - name: chamber_name
        description: 院の日本語名称（衆議院/参議院）。
      - name: election_date
        description: 投票日。
      - name: prefecture_id
        description: 都道府県コード（JIS X 0401準拠）。
      - name: prefecture_name
        description: 都道府県名。
      - name: region
        description: 地方区分。
      - name: eligible_voters
        description: 有権者数。
      - name: actual_voters
        description: 投票者数。
      - name: turnout_rate
        description: 投票率（%）。当該都道府県の actual_voters / eligible_voters * 100。
      - name: national_turnout_rate
        description: 全国投票率（%）。当該選挙の全国平均。
      - name: region_turnout_rate
        description: 地方別投票率（%）。当該選挙の地方別平均。
      - name: diff_from_national
        description: 全国平均との差（ポイント）。turnout_rate - national_turnout_rate。
      - name: turnout_rank
        description: 投票率ランキング。当該選挙内で投票率の降順。

semantic_models:
  - name: voter_turnout
    model: ref('voter_turnout')
    description: 選挙ごとの都道府県別投票率の分析モデル。
    defaults:
      agg_time_dimension: election_date
    entities:
      - name: voter_turnout
        type: primary
        expr: "concat(cast(election_id as string), '_', cast(prefecture_id as string))"
      - name: election
        type: foreign
        expr: election_id
      - name: prefecture
        type: foreign
        expr: prefecture_id
    dimensions:
      - name: election_date
        type: time
        type_params:
          time_granularity: day
      - name: chamber
        type: categorical
      - name: chamber_name
        type: categorical
      - name: prefecture_name
        type: categorical
      - name: region
        type: categorical
    measures:
      - name: total_eligible_voters
        description: 有権者数の合計。
        agg: sum
        expr: eligible_voters
      - name: total_actual_voters
        description: 投票者数の合計。
        agg: sum
        expr: actual_voters
      - name: avg_turnout_rate
        description: 平均投票率。
        agg: average
        expr: turnout_rate
      - name: max_turnout_rate
        description: 最高投票率。
        agg: max
        expr: turnout_rate
      - name: min_turnout_rate
        description: 最低投票率。
        agg: min
        expr: turnout_rate

metrics:
  - name: total_voters
    description: 投票者数の合計。
    type: simple
    label: 投票者数
    type_params:
      measure:
        name: total_actual_voters
  - name: average_turnout
    description: 平均投票率。
    type: simple
    label: 平均投票率
    type_params:
      measure:
        name: avg_turnout_rate
  - name: eligible_voters_total
    description: 有権者数の合計。
    type: simple
    label: 有権者数
    type_params:
      measure:
        name: total_eligible_voters
  - name: weighted_turnout_rate
    description: 加重平均投票率（有権者数で加重）。
    type: derived
    label: 加重投票率
    type_params:
      expr: total_actual_voters / total_eligible_voters * 100
      metrics:
        - name: total_voters
          alias: total_actual_voters
        - name: eligible_voters_total
          alias: total_eligible_voters

unit_tests:
  - name: test_diff_from_national_calculation
    description: 全国平均との差分が正しく計算されることを検証。
    model: voter_turnout
    given:
      - input: ref('stg_prefecture_turnout')
        rows:
          - {election_id: 7, prefecture_id: 1, eligible_voters: 1000000, actual_voters: 600000, turnout_rate: 60.0}
          - {election_id: 7, prefecture_id: 2, eligible_voters: 1000000, actual_voters: 500000, turnout_rate: 50.0}
      - input: ref('stg_elections')
        rows:
          - {election_id: 7, election_name: "テスト選挙", chamber: "lower", chamber_name: "衆議院", election_date: "2021-10-31"}
      - input: ref('stg_prefectures')
        rows:
          - {prefecture_id: 1, prefecture_name: "A県", region: "関東"}
          - {prefecture_id: 2, prefecture_name: "B県", region: "関東"}
    expect:
      rows:
        - {election_id: 7, prefecture_id: 1, turnout_rate: 60.0, national_turnout_rate: 55.0, diff_from_national: 5.0, turnout_rank: 1}
        - {election_id: 7, prefecture_id: 2, turnout_rate: 50.0, national_turnout_rate: 55.0, diff_from_national: -5.0, turnout_rank: 2}
