version: 2

models:
  - name: hub_department
    description: 部門ビジネスキーのレジストリ。DEPARTMENT_ID のユニーク一覧を Insert-only で保持する。
    columns:
      - name: DEPARTMENT_HK
        description: 部門ハッシュキー（PK）
        data_tests: [unique, not_null]
      - name: DEPARTMENT_ID
        description: 部門ビジネスキー（DEPT-001 形式）
        data_tests: [unique, not_null]
      - name: LOAD_DATETIME
        description: 初回ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
