version: 2

models:
  - name: hub_patient
    description: 患者ビジネスキーのレジストリ。PATIENT_ID のユニーク一覧を Insert-only で保持する。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー（PK）
        data_tests: [unique, not_null]
      - name: PATIENT_ID
        description: 患者ビジネスキー（PAT-001 形式）
        data_tests: [unique, not_null]
      - name: LOAD_DATETIME
        description: 初回ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
