version: 2

models:
  - name: hub_visit
    description: 診察ビジネスキーのレジストリ。VISIT_ID のユニーク一覧を Insert-only で保持する。
    columns:
      - name: VISIT_HK
        description: 診察ハッシュキー（PK）
        data_tests: [unique, not_null]
      - name: VISIT_ID
        description: 診察ビジネスキー（VIS-001 形式）
        data_tests: [unique, not_null]
      - name: LOAD_DATETIME
        description: 初回ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
