version: 2

models:
  - name: hub_insurance_company
    description: 保険会社ビジネスキーのレジストリ。INSURANCE_ID のユニーク一覧を Insert-only で保持する。
    columns:
      - name: INSURANCE_HK
        description: 保険会社ハッシュキー（PK）
        data_tests: [unique, not_null]
      - name: INSURANCE_ID
        description: 保険会社ビジネスキー（INS-001 形式）
        data_tests: [unique, not_null]
      - name: LOAD_DATETIME
        description: 初回ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
