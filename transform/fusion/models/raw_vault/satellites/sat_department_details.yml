version: 2

models:
  - name: sat_department_details
    description: >
      部門の記述属性（部門名、階数等）の履歴。HASHDIFF で変更を検出し、
      変更があれば新行が Insert される。
    columns:
      - name: DEPARTMENT_HK
        description: 部門ハッシュキー（FK → hub_department、複合PKの一部）
        data_tests: [not_null]
      - name: HASHDIFF
        description: 属性変更検出用ハッシュ
        data_tests: [not_null]
      - name: DEPARTMENT_NAME
        description: 部門名
      - name: FLOOR
        description: 階数
      - name: PHONE_EXTENSION
        description: 内線番号
      - name: LOAD_DATETIME
        description: ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
