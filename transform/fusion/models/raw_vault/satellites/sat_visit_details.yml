version: 2

models:
  - name: sat_visit_details
    description: >
      診察の記述属性（診断、治療費等）の履歴。HASHDIFF で変更を検出し、
      変更があれば新行が Insert される。
    columns:
      - name: VISIT_HK
        description: 診察ハッシュキー（FK → hub_visit、複合PKの一部）
        data_tests: [not_null]
      - name: HASHDIFF
        description: 属性変更検出用ハッシュ
        data_tests: [not_null]
      - name: DIAGNOSIS_CODE
        description: 診断コード
      - name: DIAGNOSIS_NAME
        description: 診断名
      - name: NOTES
        description: 診察備考
      - name: TREATMENT_COST
        description: 治療費
      - name: LOAD_DATETIME
        description: ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
