version: 2

models:
  - name: sat_medication_details
    description: >
      薬品の記述属性（薬品名、種別、製造元、単価）の履歴。HASHDIFF で変更を検出し、
      変更があれば新行が Insert される。
    columns:
      - name: MEDICATION_HK
        description: 薬品ハッシュキー（FK → hub_medication、複合PKの一部）
        data_tests: [not_null]
      - name: HASHDIFF
        description: 属性変更検出用ハッシュ
        data_tests: [not_null]
      - name: MEDICATION_NAME
        description: 薬品名
      - name: TYPE
        description: 種別（内服/外用/注射）
      - name: MANUFACTURER
        description: 製造元
      - name: UNIT_PRICE
        description: 単価
      - name: LOAD_DATETIME
        description: ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
