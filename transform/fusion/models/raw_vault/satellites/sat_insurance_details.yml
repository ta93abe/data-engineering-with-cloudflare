version: 2

models:
  - name: sat_insurance_details
    description: >
      保険会社の記述属性（会社名、プラン種別）の履歴。HASHDIFF で変更を検出し、
      変更があれば新行が Insert される。
    columns:
      - name: INSURANCE_HK
        description: 保険会社ハッシュキー（FK → hub_insurance_company、複合PKの一部）
        data_tests: [not_null]
      - name: HASHDIFF
        description: 属性変更検出用ハッシュ
        data_tests: [not_null]
      - name: COMPANY_NAME
        description: 保険会社名
      - name: PLAN_TYPE
        description: プラン種別（国保/社保/共済）
      - name: LOAD_DATETIME
        description: ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
