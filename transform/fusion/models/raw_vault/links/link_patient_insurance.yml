version: 2

models:
  - name: link_patient_insurance
    description: >
      患者×保険会社のLink。
      患者がどの保険会社に加入しているかの関係を記録する。
    columns:
      - name: LINK_PATIENT_INSURANCE_HK
        description: Link ハッシュキー（PK、PATIENT_ID + INSURANCE_ID の複合ハッシュ）
        data_tests: [unique, not_null]
      - name: PATIENT_HK
        description: 患者ハッシュキー（FK → hub_patient）
        data_tests: [not_null]
      - name: INSURANCE_HK
        description: 保険会社ハッシュキー（FK → hub_insurance_company）
        data_tests: [not_null]
      - name: LOAD_DATETIME
        description: 初回ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
