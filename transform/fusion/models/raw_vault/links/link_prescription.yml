version: 2

models:
  - name: link_prescription
    description: >
      診察×薬品の標準Link（2キー）。
      診察で処方された薬品の関係を記録する。
    columns:
      - name: LINK_PRESCRIPTION_HK
        description: Link ハッシュキー（PK、VISIT_ID + MEDICATION_ID の複合ハッシュ）
        data_tests: [unique, not_null]
      - name: VISIT_HK
        description: 診察ハッシュキー（FK → hub_visit）
        data_tests: [not_null]
      - name: MEDICATION_HK
        description: 薬品ハッシュキー（FK → hub_medication）
        data_tests: [not_null]
      - name: LOAD_DATETIME
        description: 初回ロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
