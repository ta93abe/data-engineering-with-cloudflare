version: 2

models:
  - name: bridge_patient_medication
    description: >
      患者→薬品の Bridge テーブル。hub_patient から hub_medication までの多段 JOIN パスを事前結合する。
      通常は patient → link_visit → link_prescription → medication と4テーブルの JOIN が必要だが、
      Bridge があれば1テーブルで済む。
      automate-dv の bridge() マクロは v0.11.0 で非推奨のため、手書き SQL で実装。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー（FK → hub_patient）
        data_tests: [not_null]
      - name: LINK_VISIT_HK
        description: 診察Link ハッシュキー（FK → link_visit）
        data_tests: [not_null]
      - name: VISIT_HK
        description: 診察ハッシュキー（FK → hub_visit）
        data_tests: [not_null]
      - name: LINK_PRESCRIPTION_HK
        description: 処方箋Link ハッシュキー（FK → link_prescription）
        data_tests: [not_null]
      - name: MEDICATION_HK
        description: 薬品ハッシュキー（FK → hub_medication）
        data_tests: [not_null]
