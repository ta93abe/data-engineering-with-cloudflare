version: 2

models:
  - name: sat_patient_visit_summary
    description: >
      患者ごとの診察統計を計算する Computed Satellite。通常の Satellite は
      「ソースからの事実」を記録するが、Computed Satellite は
      「計算・集約された派生データ」を保持する。
      RECORD_SOURCE = 'COMPUTED' でソースデータと区別。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー（FK → hub_patient）
        data_tests: [unique, not_null]
      - name: TOTAL_VISITS
        description: 総診察回数
      - name: DISTINCT_DOCTORS
        description: 担当医師数（ユニーク）
      - name: DISTINCT_DIAGNOSES
        description: 診断コード数（ユニーク）
      - name: TOTAL_TREATMENT_COST
        description: 治療費合計
      - name: AVG_TREATMENT_COST
        description: 治療費平均
      - name: FIRST_VISIT_DATE
        description: 初回診察日
      - name: LAST_VISIT_DATE
        description: 最終診察日
      - name: DISTINCT_MEDICATIONS
        description: 処方された薬の種類数
      - name: LOAD_DATETIME
        description: 計算実行日時
      - name: RECORD_SOURCE
        description: データソース識別子（常に 'COMPUTED'）
