version: 2

models:
  - name: pit_patient
    description: >
      患者の PIT（Point-In-Time）テーブル。hub_patient に紐づく Satellite について、
      各時点（AS_OF_DATE）での「最新レコード」の LOAD_DATETIME を保持する。
      これにより、任意の時点での患者の状態を効率的にクエリできる。
      automate-dv の pit() マクロは v0.11.0 で非推奨のため、手書き SQL で実装。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー（FK → hub_patient）
        data_tests: [not_null]
      - name: AS_OF_DATE
        description: 時点（この日時における最新 Satellite レコードを特定）
        data_tests: [not_null]
      - name: SAT_PATIENT_DETAILS_LDTS
        description: その時点での sat_patient_details の最新 LOAD_DATETIME
        data_tests: [not_null]
