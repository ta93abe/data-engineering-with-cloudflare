models:
  - name: stg_parties
    description: 政党マスタのステージングモデル。1行1政党。
    columns:
      - name: party_id
        description: 政党の一意キー。
        data_tests:
          - not_null
          - unique
      - name: party_name
        description: 政党の正式名称（例：自由民主党）。
      - name: party_abbreviation
        description: 政党の略称（例：自民）。
      - name: founded_year
        description: 政党の設立年。「その他・諸派」はnull。
