models:
  - name: stg_prefecture_turnout
    description: 都道府県別投票率のステージングモデル。1行1選挙×1都道府県。投票率を算出。
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "turnout_rate >= 0 and turnout_rate <= 100"
    columns:
      - name: election_id
        description: 選挙ID。stg_electionsへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_elections')
                field: election_id
      - name: prefecture_id
        description: 都道府県コード。stg_prefecturesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_prefectures')
                field: prefecture_id
      - name: eligible_voters
        description: 有権者数。
      - name: actual_voters
        description: 投票者数。
      - name: turnout_rate
        description: 投票率（%）。actual_voters / eligible_voters * 100 で算出。小数点第2位まで。

unit_tests:
  - name: test_turnout_rate_calculation
    description: turnout_rate が actual_voters / eligible_voters * 100 と一致することを検証。
    model: stg_prefecture_turnout
    given:
      - input: ref('raw_prefecture_turnout')
        rows:
          - {election_id: 7, prefecture_id: 13, eligible_voters: 1000000, actual_voters: 569300}
          - {election_id: 7, prefecture_id: 27, eligible_voters: 2000000, actual_voters: 1052000}
    expect:
      rows:
        - {election_id: 7, prefecture_id: 13, eligible_voters: 1000000, actual_voters: 569300, turnout_rate: 56.93}
        - {election_id: 7, prefecture_id: 27, eligible_voters: 2000000, actual_voters: 1052000, turnout_rate: 52.60}
