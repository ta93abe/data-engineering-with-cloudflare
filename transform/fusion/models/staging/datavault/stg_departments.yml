version: 2

models:
  - name: stg_departments
    description: >
      部門データのステージング。automate-dv stage マクロで DEPARTMENT_HK と
      DEPARTMENT_HASHDIFF を生成する。
    columns:
      - name: DEPARTMENT_HK
        description: 部門ハッシュキー（DEPARTMENT_ID の MD5）
        data_tests: [not_null]
      - name: DEPARTMENT_HASHDIFF
        description: 部門属性の変更検出用ハッシュ
      - name: DEPARTMENT_ID
        description: 部門ビジネスキー（DEPT-001 形式）
      - name: LOAD_DATETIME
        description: データロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
