version: 2

models:
  - name: stg_prescriptions
    description: >
      処方箋データのステージング。診察×薬品の Link 用複合キー（LINK_PRESCRIPTION_HK）と
      PRESCRIPTION_HASHDIFF を生成する。
    columns:
      - name: VISIT_HK
        description: 診察ハッシュキー
      - name: MEDICATION_HK
        description: 薬品ハッシュキー
      - name: LINK_PRESCRIPTION_HK
        description: Link用複合ハッシュキー（VISIT_ID + MEDICATION_ID + PRESCRIPTION_ID の MD5）
        data_tests: [not_null]
      - name: PRESCRIPTION_HASHDIFF
        description: 処方箋属性の変更検出用ハッシュ
      - name: LOAD_DATETIME
        description: データロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
