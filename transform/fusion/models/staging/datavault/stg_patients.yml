version: 2

models:
  - name: stg_patients
    description: >
      患者データのステージング。automate-dv stage マクロで PATIENT_HK（ハッシュキー）と
      PATIENT_HASHDIFF（変更検出用ハッシュ）を生成する。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー（PATIENT_ID の MD5）
        data_tests: [not_null]
      - name: PATIENT_HASHDIFF
        description: 患者属性の変更検出用ハッシュ
      - name: PATIENT_ID
        description: 患者ビジネスキー（PAT-001 形式）
      - name: LOAD_DATETIME
        description: データロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
