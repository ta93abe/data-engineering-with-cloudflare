version: 2

models:
  - name: stg_patient_insurance
    description: >
      患者保険データのステージング。患者×保険の Link 用複合キー（LINK_PATIENT_INSURANCE_HK）と
      PATIENT_INSURANCE_HASHDIFF を生成する。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー
      - name: INSURANCE_HK
        description: 保険会社ハッシュキー
      - name: LINK_PATIENT_INSURANCE_HK
        description: Link用複合ハッシュキー（PATIENT_ID + INSURANCE_ID の MD5）
        data_tests: [not_null]
      - name: PATIENT_INSURANCE_HASHDIFF
        description: 患者保険属性の変更検出用ハッシュ
      - name: LOAD_DATETIME
        description: データロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
