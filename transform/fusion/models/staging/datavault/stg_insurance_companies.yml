version: 2

models:
  - name: stg_insurance_companies
    description: >
      保険会社データのステージング。automate-dv stage マクロで INSURANCE_HK と
      INSURANCE_HASHDIFF を生成する。
    columns:
      - name: INSURANCE_HK
        description: 保険会社ハッシュキー（INSURANCE_ID の MD5）
        data_tests: [not_null]
      - name: INSURANCE_HASHDIFF
        description: 保険会社属性の変更検出用ハッシュ
      - name: INSURANCE_ID
        description: 保険会社ビジネスキー（INS-001 形式）
      - name: LOAD_DATETIME
        description: データロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
