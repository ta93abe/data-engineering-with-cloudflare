version: 2

models:
  - name: stg_visits
    description: >
      診察データのステージング。複数のハッシュキー（患者・医師・診察・Link用複合キー）と
      VISIT_HASHDIFF（変更検出用ハッシュ）を生成する。
    columns:
      - name: PATIENT_HK
        description: 患者ハッシュキー
      - name: DOCTOR_HK
        description: 医師ハッシュキー
      - name: VISIT_HK
        description: 診察ハッシュキー（VISIT_ID の MD5）
      - name: LINK_VISIT_HK
        description: Link用複合ハッシュキー（PATIENT_ID + DOCTOR_ID + VISIT_ID の MD5）
        data_tests: [not_null]
      - name: VISIT_HASHDIFF
        description: 診察属性の変更検出用ハッシュ
      - name: LOAD_DATETIME
        description: データロード日時
      - name: RECORD_SOURCE
        description: データソース識別子
