name: fusion
version: '1.0.0'

profile: fusion

flags:
  use_managed_iceberg: true

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  fusion:
    +schema: raw

models:
  fusion:
    staging:
      +materialized: view
      +schema: staging

    marts:
      +materialized: table
      +schema: marts
