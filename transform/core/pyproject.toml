[project]
name = "dbt-core-project"
version = "0.1.0"
description = "dbt project for Cloudflare Data Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-duckdb>=1.9.0",
    "dbt-snowflake>=1.9.0",
    "elementary-data>=0.16.1",
    "dbt-osmosis>=1.0.0",
]

[dependency-groups]
dev = [
    "shandy-sqlfmt[jinjafmt]>=0.24.0",
    "sqruff>=0.24.0",
]

[tool.sqlfmt]
line_length = 120
