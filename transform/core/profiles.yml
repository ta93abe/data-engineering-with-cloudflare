core:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'dev.duckdb'
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('R2_ENDPOINT', '') }}"
        s3_access_key_id: "{{ env_var('R2_ACCESS_KEY_ID', '') }}"
        s3_secret_access_key: "{{ env_var('R2_SECRET_ACCESS_KEY', '') }}"
        s3_url_style: 'path'
      threads: 4

    ci:
      type: duckdb
      path: ':memory:'
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('R2_ENDPOINT', '') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('R2_ACCESS_KEY_ID', '') }}"
        s3_secret_access_key: "{{ env_var('R2_SECRET_ACCESS_KEY', '') }}"
        s3_url_style: 'path'
        s3_use_ssl: true
      threads: 2

    prod:
      type: duckdb
      path: 'prod.duckdb'
      extensions:
        - httpfs
        - parquet
        - iceberg
      settings:
        s3_endpoint: "{{ env_var('R2_ENDPOINT', '') }}"
        s3_access_key_id: "{{ env_var('R2_ACCESS_KEY_ID', '') }}"
        s3_secret_access_key: "{{ env_var('R2_SECRET_ACCESS_KEY', '') }}"
        s3_url_style: 'path'
      threads: 8

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ORGANIZATION_NAME') }}-{{ env_var('SNOWFLAKE_ACCOUNT_NAME') }}"
      user: DBT_SERVICE_USER
      role: DBT_ROLE
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      warehouse: ANALYTICS_WH
      database: CORE
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'PUBLIC') }}"
      threads: 4
