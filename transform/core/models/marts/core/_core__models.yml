version: 2

models:
  # Dimension Tables
  - name: dim_users
    description: "User dimension with calculated metrics and segmentation"
    columns:
      - name: user_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: customer_segment
        description: "Customer value segment (High/Medium/Low/No Purchase)"

  - name: dim_products
    description: "Product dimension with sales metrics and performance tier"
    columns:
      - name: product_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: performance_tier
        description: "Product performance tier (Top/Good/Low/No Sales)"

  - name: dim_dates
    description: "Date dimension for 2024"
    columns:
      - name: date_day
        description: "Primary key - calendar date"
        data_tests:
          - unique
          - not_null

  # Fact Tables
  - name: fct_orders
    description: "Order fact table with revenue and profit metrics"
    columns:
      - name: order_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "FK to dim_users"
        data_tests:
          - not_null
      - name: order_date
        description: "FK to dim_dates"
        data_tests:
          - not_null

  - name: fct_order_items
    description: "Order item fact table (grain: line item)"
    columns:
      - name: order_item_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "FK to fct_orders"
        data_tests:
          - not_null
      - name: product_id
        description: "FK to dim_products"
        data_tests:
          - not_null

  - name: fct_daily_sales
    description: "Daily sales aggregate fact table"
    columns:
      - name: order_date
        description: "Primary key - date"
        data_tests:
          - unique
          - not_null
