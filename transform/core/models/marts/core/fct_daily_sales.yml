version: 2

models:
  - name: fct_daily_sales
    description: "Daily sales aggregate fact table"
    columns:
      - name: order_date
        description: "Primary key - date"
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: "Total number of orders"
      - name: completed_orders
        description: "Number of completed orders"
      - name: cancelled_orders
        description: "Number of cancelled orders"
      - name: refunded_orders
        description: "Number of refunded orders"
      - name: unique_customers
        description: "Number of unique customers"
      - name: total_items_sold
        description: "Total line items sold"
      - name: total_units_sold
        description: "Total units sold"
      - name: unique_products_sold
        description: "Number of unique products sold"
      - name: unique_categories
        description: "Number of unique categories"
      - name: gross_revenue
        description: "Gross revenue"
      - name: total_discounts
        description: "Total discount amount"
      - name: net_revenue
        description: "Net revenue after discounts"
      - name: total_cost
        description: "Total cost of goods sold"
      - name: total_profit
        description: "Total profit"
      - name: avg_order_value
        description: "Average order value"
      - name: profit_margin_percent
        description: "Profit margin as percentage"
      - name: updated_at
        description: "Timestamp when record was last updated"

unit_tests:
  - name: test_daily_sales_aggregation
    description: "Daily sales should aggregate orders correctly"
    model: fct_daily_sales
    given:
      - input: ref('fct_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", gross_amount: 20000, discount_amount: 1000, net_amount: 19000, total_cost: 12000, profit: 7000, is_completed: true, is_cancelled: false, is_refunded: false }
          - { order_id: 2, user_id: 2, order_date: "2024-01-15", status: "completed", gross_amount: 30000, discount_amount: 2000, net_amount: 28000, total_cost: 18000, profit: 10000, is_completed: true, is_cancelled: false, is_refunded: false }
      - input: ref('fct_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, user_id: 1, product_id: 1, order_date: "2024-01-15", quantity: 2, product_category: "Electronics", is_completed: true }
          - { order_item_id: 2, order_id: 2, user_id: 2, product_id: 2, order_date: "2024-01-15", quantity: 3, product_category: "Clothing", is_completed: true }
    expect:
      rows:
        - { order_date: "2024-01-15", total_orders: 2, completed_orders: 2, unique_customers: 2, gross_revenue: 50000, total_discounts: 3000, net_revenue: 47000, total_profit: 17000 }

  - name: test_daily_sales_with_cancelled_orders
    description: "Cancelled orders should be counted but not in completed"
    model: fct_daily_sales
    given:
      - input: ref('fct_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", gross_amount: 20000, discount_amount: 0, net_amount: 20000, total_cost: 12000, profit: 8000, is_completed: true, is_cancelled: false, is_refunded: false }
          - { order_id: 2, user_id: 2, order_date: "2024-01-15", status: "cancelled", gross_amount: 30000, discount_amount: 0, net_amount: 30000, total_cost: 18000, profit: 12000, is_completed: false, is_cancelled: true, is_refunded: false }
      - input: ref('fct_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, user_id: 1, product_id: 1, order_date: "2024-01-15", quantity: 2, product_category: "Electronics", is_completed: true }
    expect:
      rows:
        - { order_date: "2024-01-15", total_orders: 2, completed_orders: 1, cancelled_orders: 1, unique_customers: 2 }

  - name: test_daily_sales_avg_order_value
    description: "Average order value should be net_revenue / completed_orders"
    model: fct_daily_sales
    given:
      - input: ref('fct_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", gross_amount: 10000, discount_amount: 0, net_amount: 10000, total_cost: 6000, profit: 4000, is_completed: true, is_cancelled: false, is_refunded: false }
          - { order_id: 2, user_id: 2, order_date: "2024-01-15", status: "completed", gross_amount: 20000, discount_amount: 0, net_amount: 20000, total_cost: 12000, profit: 8000, is_completed: true, is_cancelled: false, is_refunded: false }
      - input: ref('fct_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, user_id: 1, product_id: 1, order_date: "2024-01-15", quantity: 1, product_category: "Electronics", is_completed: true }
          - { order_item_id: 2, order_id: 2, user_id: 2, product_id: 2, order_date: "2024-01-15", quantity: 2, product_category: "Electronics", is_completed: true }
    expect:
      rows:
        - { order_date: "2024-01-15", net_revenue: 30000, completed_orders: 2, avg_order_value: 15000.0 }

  - name: test_daily_sales_profit_margin
    description: "Profit margin percent should be total_profit / net_revenue * 100"
    model: fct_daily_sales
    given:
      - input: ref('fct_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", gross_amount: 20000, discount_amount: 0, net_amount: 20000, total_cost: 12000, profit: 8000, is_completed: true, is_cancelled: false, is_refunded: false }
      - input: ref('fct_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, user_id: 1, product_id: 1, order_date: "2024-01-15", quantity: 2, product_category: "Electronics", is_completed: true }
    expect:
      rows:
        - { order_date: "2024-01-15", net_revenue: 20000, total_profit: 8000, profit_margin_percent: 40.0 }

  - name: test_daily_sales_no_completed_items
    description: "Days with no completed items should have zero item metrics"
    model: fct_daily_sales
    given:
      - input: ref('fct_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "cancelled", gross_amount: 20000, discount_amount: 0, net_amount: 20000, total_cost: 12000, profit: 8000, is_completed: false, is_cancelled: true, is_refunded: false }
      - input: ref('fct_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, user_id: 1, product_id: 1, order_date: "2024-01-15", quantity: 2, product_category: "Electronics", is_completed: false }
    expect:
      rows:
        - { order_date: "2024-01-15", total_orders: 1, cancelled_orders: 1, total_items_sold: 0, total_units_sold: 0 }
