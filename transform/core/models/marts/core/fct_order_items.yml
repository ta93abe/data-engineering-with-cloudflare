version: 2

models:
  - name: fct_order_items
    description: "Order item fact table (grain: line item)"
    columns:
      - name: order_item_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "FK to fct_orders"
        data_tests:
          - not_null
      - name: user_id
        description: "FK to dim_users"
      - name: product_id
        description: "FK to dim_products"
        data_tests:
          - not_null
      - name: order_date
        description: "FK to dim_dates"
      - name: order_status
        description: "Order status"
      - name: payment_method
        description: "Payment method used"
      - name: shipping_country
        description: "Country order is shipped to"
      - name: product_category
        description: "Product category"
      - name: product_subcategory
        description: "Product subcategory"
      - name: quantity
        description: "Quantity ordered"
      - name: unit_price
        description: "Price per unit"
      - name: gross_amount
        description: "Line total (quantity * unit_price)"
      - name: unit_cost
        description: "Cost per unit"
      - name: total_cost
        description: "Total cost (unit_cost * quantity)"
      - name: profit
        description: "Line item profit"
      - name: profit_margin_percent
        description: "Profit margin as percentage"
      - name: is_completed
        description: "Whether order is completed"
      - name: updated_at
        description: "Timestamp when record was last updated"

unit_tests:
  - name: test_order_item_profit_margin
    description: "Profit margin should be (line_total - cost) / line_total * 100"
    model: fct_order_items
    given:
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 2, unit_price: 10000, line_total: 20000 }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
    expect:
      rows:
        - { order_item_id: 1, gross_amount: 20000, total_cost: 12000, profit: 8000, profit_margin_percent: 40.0 }

  - name: test_order_item_zero_margin
    description: "Items with cost equal to price should have 0% margin"
    model: fct_order_items
    given:
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 1, unit_price: 10000, line_total: 10000 }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 10000, margin: 0, is_active: true }
    expect:
      rows:
        - { order_item_id: 1, profit: 0, profit_margin_percent: 0.0 }

  - name: test_order_item_negative_margin
    description: "Items sold below cost should have negative margin"
    model: fct_order_items
    given:
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 1, unit_price: 8000, line_total: 8000 }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 10000, margin: 0, is_active: true }
    expect:
      rows:
        - { order_item_id: 1, profit: -2000, profit_margin_percent: -25.0 }

  - name: test_order_item_is_completed_flag
    description: "is_completed should reflect order status"
    model: fct_order_items
    given:
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 1, unit_price: 10000, line_total: 10000 }
          - { order_item_id: 2, order_id: 2, product_id: 1, quantity: 1, unit_price: 10000, line_total: 10000 }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
          - { order_id: 2, user_id: 1, order_date: "2024-01-16", status: "cancelled", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
    expect:
      rows:
        - { order_item_id: 1, is_completed: true }
        - { order_item_id: 2, is_completed: false }
