version: 2

models:
  - name: fct_orders
    description: "Order fact table with revenue and profit metrics"
    columns:
      - name: order_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "FK to dim_users"
        data_tests:
          - not_null
      - name: order_date
        description: "FK to dim_dates"
        data_tests:
          - not_null
      - name: status
        description: "Order status"
      - name: payment_method
        description: "Payment method used"
      - name: shipping_country
        description: "Country order is shipped to"
      - name: total_items
        description: "Number of distinct line items"
      - name: total_quantity
        description: "Total quantity of items"
      - name: gross_amount
        description: "Gross order amount before discount"
      - name: discount_amount
        description: "Discount amount applied"
      - name: net_amount
        description: "Net amount after discount"
      - name: total_cost
        description: "Total cost of goods sold"
      - name: profit
        description: "Order profit (net_amount - total_cost)"
      - name: is_completed
        description: "Whether order is completed"
      - name: is_cancelled
        description: "Whether order is cancelled"
      - name: is_refunded
        description: "Whether order is refunded"
      - name: updated_at
        description: "Timestamp when record was last updated"

unit_tests:
  - name: test_order_profit_calculation
    description: "Order profit should be gross_amount - discount - total_cost"
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 1000 }
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 2, unit_price: 10000, line_total: 20000 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
    expect:
      rows:
        - { order_id: 1, gross_amount: 20000, discount_amount: 1000, net_amount: 19000, total_cost: 12000, profit: 7000 }

  - name: test_order_status_flags_completed
    description: "Completed orders should have is_completed=true"
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 1, unit_price: 10000, line_total: 10000 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
    expect:
      rows:
        - { order_id: 1, is_completed: true, is_cancelled: false, is_refunded: false }

  - name: test_order_status_flags_cancelled
    description: "Cancelled orders should have is_cancelled=true"
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "cancelled", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 1, unit_price: 10000, line_total: 10000 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
    expect:
      rows:
        - { order_id: 1, is_completed: false, is_cancelled: true, is_refunded: false }

  - name: test_order_status_flags_refunded
    description: "Refunded orders should have is_refunded=true"
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "refunded", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 0 }
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 1, unit_price: 10000, line_total: 10000 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Test Product", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
    expect:
      rows:
        - { order_id: 1, is_completed: false, is_cancelled: false, is_refunded: true }

  - name: test_order_multiple_items
    description: "Orders with multiple items should aggregate correctly"
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - { order_id: 1, user_id: 1, order_date: "2024-01-15", status: "completed", payment_method: "credit_card", shipping_country: "Japan", discount_amount: 2000 }
      - input: ref('stg_order_items')
        rows:
          - { order_item_id: 1, order_id: 1, product_id: 1, quantity: 2, unit_price: 10000, line_total: 20000 }
          - { order_item_id: 2, order_id: 1, product_id: 2, quantity: 1, unit_price: 15000, line_total: 15000 }
      - input: ref('stg_products')
        rows:
          - { product_id: 1, product_name: "Product A", category: "Electronics", subcategory: "Phones", price: 10000, cost: 6000, margin: 4000, is_active: true }
          - { product_id: 2, product_name: "Product B", category: "Electronics", subcategory: "Tablets", price: 15000, cost: 9000, margin: 6000, is_active: true }
    expect:
      rows:
        - { order_id: 1, total_items: 2, total_quantity: 3, gross_amount: 35000, net_amount: 33000, total_cost: 21000, profit: 12000 }
