version: 2

models:
  - name: dim_dates
    description: "Date dimension table providing calendar attributes for each day"
    columns:
      - name: date_day
        description: "Primary key - calendar date"
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year"
      - name: quarter
        description: "Calendar quarter (1-4)"
      - name: month
        description: "Calendar month (1-12)"
      - name: week_of_year
        description: "Week number of the year"
      - name: day_of_month
        description: "Day of the month (1-31)"
      - name: day_of_week
        description: "Day of the week (0=Sunday, 6=Saturday)"
      - name: year_month
        description: "Year and month formatted as YYYY-MM"
      - name: year_quarter
        description: "Year and quarter formatted as YYYY-Q#"
      - name: month_name
        description: "Full month name"
      - name: day_name
        description: "Full day name"
      - name: is_weekend
        description: "Whether date falls on weekend"
      - name: is_weekday
        description: "Whether date falls on weekday"
      - name: fiscal_year
        description: "Fiscal year"
      - name: fiscal_quarter
        description: "Fiscal quarter"
