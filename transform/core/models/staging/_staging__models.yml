version: 2

models:
  - name: stg_sample
    description: "Staged sample data with standardized column names"

    columns:
      - name: id
        description: "Primary key"
        data_tests:
          - unique
          - not_null

      - name: name
        description: "Name field"
        data_tests:
          - not_null

      - name: created_at
        description: "Record creation timestamp (UTC)"
