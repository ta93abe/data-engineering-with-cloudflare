version: 2

models:
  - name: stg_users
    description: "Staged user data"
    columns:
      - name: user_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null

  - name: stg_products
    description: "Staged product data with calculated margin"
    columns:
      - name: product_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Staged order data"
    columns:
      - name: order_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null

  - name: stg_order_items
    description: "Staged order items with line total"
    columns:
      - name: order_item_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
