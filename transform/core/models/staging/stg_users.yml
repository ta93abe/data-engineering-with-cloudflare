version: 2

models:
  - name: stg_users
    description: "Staged user data from seed"
    columns:
      - name: user_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: username
        description: "User display name"
      - name: email
        description: "User email address"
      - name: country
        description: "User country"
      - name: signup_date
        description: "Date when user signed up"
      - name: is_premium
        description: "Whether user has premium subscription"
      - name: lifetime_value
        description: "User's lifetime value"
