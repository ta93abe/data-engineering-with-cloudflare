version: 2

models:
  - name: stg_order_items
    description: "Staged order items with calculated line total"
    columns:
      - name: order_item_id
        description: "Primary key"
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "FK to orders"
        data_tests:
          - not_null
      - name: product_id
        description: "FK to products"
        data_tests:
          - not_null
      - name: quantity
        description: "Quantity ordered"
      - name: unit_price
        description: "Price per unit"
      - name: line_total
        description: "Calculated line total (quantity * unit_price)"
